name: macOS CleanShot 4.8.10 sealed runtime probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'cleanshot-4810-runtime-probe-*'

permissions:
  contents: read

concurrency:
  group: macos-cleanshot-4810-runtime-probe
  cancel-in-progress: true

jobs:
  run:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out sealed validation bundle
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Execute sealed CleanShot runtime probe
        id: execute
        shell: bash
        env:
          BUNDLE_KEY: ${{ secrets.CLEANSHOT_4810_PROBE_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cleanshot-4810-runtime-probe"
          mkdir -p "$work"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass env:BUNDLE_KEY \
            -in .opaque/cleanshot-4810-runtime-probe.bin \
            -out "$work/bundle.tgz"
          tar -xzf "$work/bundle.tgz" -C "$work"
          payload_root="$(find "$work" -mindepth 1 -maxdepth 2 -type f -name entrypoint.sh -print -quit | xargs dirname)"
          test -n "$payload_root"
          set +e
          "$payload_root/entrypoint.sh" > "$payload_root/runner.log" 2>&1
          payload_rc=$?
          set -e
          printf '%s\n' "$payload_rc" > "$work/payload.rc"
          # Keep the encrypted evidence small; identity hashes and signature logs are retained,
          # while the reproducibly downloaded DMG and copied app bundle are excluded.
          tar -czf "$work/result.tgz" \
            --exclude='out/CleanShot-X-4.8.10.dmg' \
            --exclude='out/CleanShot-Official.app' \
            -C "$payload_root" out runner.log
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -pass env:BUNDLE_KEY \
            -in "$work/result.tgz" \
            -out "$work/result.bin"
          echo "payload_rc=$payload_rc" >> "$GITHUB_OUTPUT"
          echo "SEALED_CLEANSHOT_4810_PROBE_RC=$payload_rc"

      - name: Upload sealed runtime evidence
        if: always() && steps.execute.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-cleanshot-4810-runtime-probe-result
          path: ${{ runner.temp }}/cleanshot-4810-runtime-probe/result.bin
          if-no-files-found: error
          retention-days: 1

      - name: Propagate validation status
        if: always() && steps.execute.outcome == 'success'
        shell: bash
        run: exit "${{ steps.execute.outputs.payload_rc }}"
